<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 358" width="100%" height="358">
  <defs>
    <style>
      .bg { fill: #0a0e14; stroke: #262c36; stroke-width: 1.5; rx: 10px; }
      .header-bg { fill: #13171f; rx: 10px; }
      .header-line { stroke: #262c36; stroke-width: 1; }
      .txt { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 13.5px; }
      .bold { font-weight: 700; }
      .title { fill: #8b949e; font-size: 12px; font-weight: 600; text-anchor: middle; }
      
      /* Terminal Colors */
      .prompt-arrow { fill: #00e5ff; }
      .prompt-cmd   { fill: #f0f6fc; }
      .cli-title    { fill: #38bdf8; font-weight: 700; font-size: 14px; }
      
      /* Ultra-Vibrant High-Contrast Palette */
      .model { fill: #00e5ff; }  /* Electric Cyan */
      .gold  { fill: #ffd600; }  /* Luminous Gold */
      .dir   { fill: #ff8500; }  /* Vivid Tangerine */
      .git   { fill: #d946ef; }  /* Electric Orchid */
      .state { fill: #00e676; }  /* Bright Neon Green */
      .red   { fill: #ff4b4b; }  /* Bright Coral Red */
      .white { fill: #f0f6fc; }  /* High-Luminance White */
      .slate { fill: #6e7891; }  /* Crisp Visible Slate */
      .dark-slate { fill: #323c4b; }
      .muted { fill: #a0afc3; }
      .dim   { fill: #545f73; }
      .divider { stroke: #21262d; stroke-width: 1; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="880" height="358" class="bg"/>
  <rect width="880" height="34" class="header-bg"/>
  <rect y="24" width="880" height="10" fill="#13171f"/>
  <line x1="0" y1="34" x2="880" y2="34" class="header-line"/>

  <!-- macOS Window Controls -->
  <circle cx="18" cy="17" r="5.5" fill="#ff5f56"/>
  <circle cx="36" cy="17" r="5.5" fill="#ffbd2e"/>
  <circle cx="54" cy="17" r="5.5" fill="#27c93f"/>
  <text x="440" y="21" class="txt title">developer@MacBook-Pro: ~/Documents/GitHub/agy-statusline</text>

  <!-- 1. Shell Launch Command -->
  <g transform="translate(24, 62)">
    <text x="0" y="0" class="txt bold prompt-arrow">❯</text>
    <text x="16" y="0" class="txt bold prompt-cmd">agy</text>
  </g>

  <!-- 2. Antigravity CLI Colored ASCII Pixel Art & Startup Metadata -->
  <g id="startup-banner">
    <!-- Row 0: Logo & Title -->
    <rect x="72.6" y="92" width="16.2" height="20" fill="#f2922e"/>
    <rect x="88.8" y="92" width="16.2" height="20" fill="#f07236"/>
    <text x="170" y="107" class="txt cli-title">Antigravity CLI 1.2.2</text>

    <!-- Row 1: Logo & Account -->
    <rect x="56.4" y="112" width="16.2" height="20" fill="#9ec345"/>
    <rect x="72.6" y="112" width="16.2" height="20" fill="#e2993d"/>
    <rect x="88.8" y="112" width="16.2" height="20" fill="#f67a34"/>
    <rect x="105.0" y="112" width="16.2" height="20" fill="#ef5442"/>
    <text x="170" y="127" class="txt">
      <tspan fill="#8b949e">developer@example.com</tspan> <tspan class="gold bold">(Google AI Pro)</tspan>
    </text>

    <!-- Row 2: Logo & Model -->
    <rect x="56.4" y="132" width="16.2" height="20" fill="#7cc251"/>
    <rect x="72.6" y="132" width="16.2" height="20" fill="#5ca98f"/>
    <rect x="88.8" y="132" width="16.2" height="20" fill="#746fc3"/>
    <rect x="105.0" y="132" width="16.2" height="20" fill="#995da8"/>
    <text x="170" y="147" class="txt bold model">Gemini 3.8 Flash (High)</text>

    <!-- Row 3: Logo & Workspace -->
    <rect x="56.4" y="152" width="16.2" height="20" fill="#61c37d"/>
    <rect x="105.0" y="152" width="16.2" height="20" fill="#4a80ea"/>
    <text x="170" y="167" class="txt slate">~/Documents/GitHub/agy-statusline</text>

    <!-- Row 4: Logo Base -->
    <rect x="40.2" y="172" width="16.2" height="20" fill="#67b9f4"/>
    <rect x="56.4" y="172" width="16.2" height="20" fill="#64b6f6"/>
    <rect x="105.0" y="172" width="16.2" height="20" fill="#3883f9"/>
    <rect x="121.2" y="172" width="16.2" height="20" fill="#3d85fc"/>
  </g>

  <!-- 3. Top Mode Divider -->
  <line x1="20" y1="212" x2="860" y2="212" class="divider"/>

  <!-- Mode Selector Line with Active Block Cursor -->
  <g transform="translate(24, 232)">
    <text x="0" y="0" class="txt bold prompt-arrow">&gt;</text>
    
    <!-- Active Straight Block Cursor on the prompt input line -->
    <rect x="15" y="-13" width="8" height="17" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="29" y="0" class="txt bold white">Accept-edits mode:</text>
    <text x="180" y="0" class="txt white">file edits auto-approved</text>
    <text x="382" y="0" class="txt slate">(shift+tab to cycle)</text>
  </g>

  <!-- Bottom Mode Divider -->
  <line x1="20" y1="250" x2="860" y2="250" class="divider"/>

  <!-- 4. Line 1: Workspace & Session Identity (Ultra-Vibrant) -->
  <g transform="translate(24, 284)">
    <!-- Flame / CPU Model Icon (Electric Cyan #00e5ff) -->
    <g transform="translate(0, -12) scale(0.65)">
      <path d="M12 2c.5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5c1.4 0 2.5-.9 2.5-2.5 0-1.4-.5-2-1-3-1-2.1-.2-4.1 2-6z" fill="#00e5ff"/>
    </g>
    <text x="18" y="0" class="txt bold model">3.8 Flash High</text>
    <text x="144" y="0" class="txt slate">|</text>

    <!-- Shield / Tier Icon (Luminous Gold #ffd600) -->
    <g transform="translate(158, -12) scale(0.65)">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#ffd600"/>
    </g>
    <text x="176" y="0" class="txt bold gold">Pro</text>

    <!-- Separator -->
    <text x="210" y="0" class="txt slate">│</text>

    <!-- Folder Icon (Vivid Tangerine #ff8500) -->
    <g transform="translate(230, -12) scale(0.65)">
      <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z" fill="#ff8500"/>
    </g>
    <text x="250" y="0" class="txt bold dir">agy-statusline</text>

    <!-- Separator -->
    <text x="376" y="0" class="txt slate">│</text>

    <!-- Git Branch Icon (Electric Orchid #d946ef) -->
    <g transform="translate(396, -13) scale(0.68)">
      <circle cx="6" cy="18" r="3" fill="#d946ef"/>
      <circle cx="6" cy="6" r="3" fill="#d946ef"/>
      <circle cx="18" cy="9" r="3" fill="#d946ef"/>
      <path d="M6 9v6M18 9a9 9 0 0 1-9 9" stroke="#d946ef" stroke-width="2.2" fill="none"/>
    </g>
    <text x="416" y="0" class="txt bold git">main</text>

    <!-- Separator -->
    <text x="462" y="0" class="txt slate">│</text>

    <!-- State Bullet + Idle (Bright Neon Green #00e676) -->
    <circle cx="486" cy="-4" r="4" fill="#00e676"/>
    <text x="496" y="0" class="txt bold state">Idle</text>
  </g>

  <!-- 5. Line 2: Telemetry & Quotas -->
  <g transform="translate(24, 318)">
    <!-- Context Chip Icon -->
    <g transform="translate(0, -13) scale(0.65)">
      <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="#f0f6fc" stroke-width="2"/>
      <rect x="7.5" y="7.5" width="9" height="9" fill="#f0f6fc"/>
      <line x1="8" y1="1" x2="8" y2="3" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="16" y1="1" x2="16" y2="3" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="8" y1="21" x2="8" y2="23" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="16" y1="21" x2="16" y2="23" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="1" y1="8" x2="3" y2="8" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="1" y1="16" x2="3" y2="16" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="21" y1="8" x2="23" y2="8" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="21" y1="16" x2="23" y2="16" stroke="#f0f6fc" stroke-width="2"/>
    </g>
    <text x="18" y="0" class="txt bold white">Context</text>
    <text x="86" y="0" class="txt dark-slate">░░░░░░░░░░</text>
    <text x="178" y="0" class="txt white">0%</text>

    <!-- Separator -->
    <text x="210" y="0" class="txt slate">│</text>

    <!-- Usage Bolt Icon -->
    <g transform="translate(228, -13) scale(0.68)">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="#f0f6fc"/>
    </g>
    <text x="246" y="0" class="txt bold white">Usage</text>

    <!-- 5h Quota Bar (2% - Dark Slate empty) -->
    <text x="298" y="0" class="txt dark-slate">░░░░░░░░░░</text>
    <text x="388" y="0" class="txt white">2%</text>
    <text x="414" y="0" class="txt muted">(</text>
    <g transform="translate(422, -11) scale(0.55)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#a0afc3" stroke-width="2"/>
      <polyline points="12 6 12 12 16 14" stroke="#a0afc3" stroke-width="2" fill="none"/>
    </g>
    <text x="438" y="0" class="txt muted">4h 55m)</text>

    <!-- Divider -->
    <text x="504" y="0" class="txt slate">|</text>

    <!-- Weekly Quota Bar (27% - Luminous Gold filled + Dark Slate empty) -->
    <text x="524" y="0" class="txt gold">███</text>
    <text x="551" y="0" class="txt dark-slate">░░░░░░░</text>
    <text x="618" y="0" class="txt white">27%</text>
    <text x="652" y="0" class="txt muted">(</text>
    <g transform="translate(660, -11) scale(0.55)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#a0afc3" stroke-width="2"/>
      <polyline points="12 6 12 12 16 14" stroke="#a0afc3" stroke-width="2" fill="none"/>
    </g>
    <text x="676" y="0" class="txt muted">2d 18h)</text>
  </g>
</svg>
