<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="100%" height="160">
  <defs>
    <style>
      .bg { fill: #0a0e14; stroke: #2d333b; stroke-width: 1.5; rx: 10px; }
      .header-bg { fill: #13171f; rx: 10px; }
      .header-line { stroke: #2d333b; stroke-width: 1; }
      .txt { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 13.5px; }
      .bold { font-weight: 700; }
      .title { fill: #8b949e; font-size: 12px; font-weight: 600; text-anchor: middle; }
      
      /* Ultra-Vibrant High-Contrast Palette */
      .model { fill: #00e5ff; }  /* Electric Cyan */
      .gold  { fill: #ffd600; }  /* Luminous Gold */
      .dir   { fill: #ff8500; }  /* Vivid Tangerine */
      .git   { fill: #d946ef; }  /* Electric Orchid */
      .state { fill: #00e676; }  /* Bright Neon Green */
      .red   { fill: #ff4b4b; }  /* Bright Coral Red */
      .white { fill: #f0f6fc; }  /* High-Luminance White */
      .slate { fill: #6e7891; }  /* Crisp Visible Slate */
      .dark-slate { fill: #323c4b; }
      .muted { fill: #a0afc3; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="880" height="160" class="bg"/>
  <rect width="880" height="34" class="header-bg"/>
  <rect y="24" width="880" height="10" fill="#13171f"/>
  <line x1="0" y1="34" x2="880" y2="34" class="header-line"/>

  <!-- macOS Window Controls -->
  <circle cx="18" cy="17" r="5.5" fill="#ff5f56"/>
  <circle cx="36" cy="17" r="5.5" fill="#ffbd2e"/>
  <circle cx="54" cy="17" r="5.5" fill="#27c93f"/>
  <text x="440" y="21" class="txt title">agy — statusline</text>

  <!-- Line 1: Workspace & Session Identity (Ultra-Vibrant) -->
  <g transform="translate(24, 76)">
    <!-- Flame / CPU Model Icon (Electric Cyan #00e5ff) -->
    <g transform="translate(0, -12) scale(0.65)">
      <path d="M12 2c.5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5c1.4 0 2.5-.9 2.5-2.5 0-1.4-.5-2-1-3-1-2.1-.2-4.1 2-6z" fill="#00e5ff"/>
    </g>
    <text x="18" y="0" class="txt bold model">3.8 Flash Med</text>
    <text x="136" y="0" class="txt slate">|</text>

    <!-- Shield / Tier Icon (Luminous Gold #ffd600) -->
    <g transform="translate(150, -12) scale(0.65)">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#ffd600"/>
    </g>
    <text x="168" y="0" class="txt bold gold">Pro</text>

    <!-- Separator -->
    <text x="202" y="0" class="txt slate">│</text>

    <!-- Folder Icon (Vivid Tangerine #ff8500) -->
    <g transform="translate(222, -12) scale(0.65)">
      <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z" fill="#ff8500"/>
    </g>
    <text x="242" y="0" class="txt bold dir">agy-statusline</text>

    <!-- Separator -->
    <text x="368" y="0" class="txt slate">│</text>

    <!-- Git Branch Icon (Electric Orchid #d946ef) -->
    <g transform="translate(388, -13) scale(0.68)">
      <circle cx="6" cy="18" r="3" fill="#d946ef"/>
      <circle cx="6" cy="6" r="3" fill="#d946ef"/>
      <circle cx="18" cy="9" r="3" fill="#d946ef"/>
      <path d="M6 9v6M18 9a9 9 0 0 1-9 9" stroke="#d946ef" stroke-width="2.2" fill="none"/>
    </g>
    <text x="408" y="0" class="txt bold git">main</text>

    <!-- Separator -->
    <text x="454" y="0" class="txt slate">│</text>

    <!-- State Bullet + Idle (Bright Neon Green #00e676) -->
    <circle cx="478" cy="-4" r="4" fill="#00e676"/>
    <text x="488" y="0" class="txt bold state">Idle</text>
  </g>

  <!-- Line 2: Telemetry & Quotas -->
  <g transform="translate(24, 122)">
    <!-- Context Chip Icon -->
    <g transform="translate(0, -13) scale(0.65)">
      <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="#f0f6fc" stroke-width="2"/>
      <rect x="7.5" y="7.5" width="9" height="9" fill="#f0f6fc"/>
      <line x1="8" y1="1" x2="8" y2="3" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="16" y1="1" x2="16" y2="3" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="8" y1="21" x2="8" y2="23" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="16" y1="21" x2="16" y2="23" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="1" y1="8" x2="3" y2="8" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="1" y1="16" x2="3" y2="16" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="21" y1="8" x2="23" y2="8" stroke="#f0f6fc" stroke-width="2"/>
      <line x1="21" y1="16" x2="23" y2="16" stroke="#f0f6fc" stroke-width="2"/>
    </g>
    <text x="18" y="0" class="txt bold white">Context</text>
    <text x="86" y="0" class="txt state">█</text>
    <text x="96" y="0" class="txt dark-slate">░░░░░░░░░</text>
    <text x="178" y="0" class="txt white">11%</text>

    <!-- Separator -->
    <text x="218" y="0" class="txt slate">│</text>

    <!-- Usage Bolt Icon -->
    <g transform="translate(236, -13) scale(0.68)">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="#f0f6fc"/>
    </g>
    <text x="254" y="0" class="txt bold white">Usage</text>

    <!-- 5h Quota Bar (96% - Bright Coral Red #ff4b4b) -->
    <text x="306" y="0" class="txt red">██████████</text>
    <text x="396" y="0" class="txt white">96%</text>
    <text x="432" y="0" class="txt muted">(</text>
    <g transform="translate(440, -11) scale(0.55)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#a0afc3" stroke-width="2"/>
      <polyline points="12 6 12 12 16 14" stroke="#a0afc3" stroke-width="2" fill="none"/>
    </g>
    <text x="456" y="0" class="txt muted">4h 51m)</text>

    <!-- Divider -->
    <text x="522" y="0" class="txt slate">|</text>

    <!-- Weekly Quota Bar (57% - Luminous Gold #ffd600) -->
    <text x="542" y="0" class="txt gold">██████</text>
    <text x="596" y="0" class="txt dark-slate">░░░░</text>
    <text x="636" y="0" class="txt white">57%</text>
    <text x="672" y="0" class="txt muted">(</text>
    <g transform="translate(680, -11) scale(0.55)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#a0afc3" stroke-width="2"/>
      <polyline points="12 6 12 12 16 14" stroke="#a0afc3" stroke-width="2" fill="none"/>
    </g>
    <text x="696" y="0" class="txt muted">3d 13h)</text>
  </g>
</svg>
